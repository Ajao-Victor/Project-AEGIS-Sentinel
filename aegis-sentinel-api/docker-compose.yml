version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aegis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AJStack
      POSTGRES_DB: aegis_sentinel
    ports:
      - "5434:5432"
    volumes:
      - aegis_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aegis_redis_data:/data

volumes:
  aegis_pg_data:
  aegis_redis_data: